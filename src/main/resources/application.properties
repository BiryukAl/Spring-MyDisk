spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://db:5432/compose-postgres
spring.datasource.username=compose-postgres
spring.datasource.password=compose-postgres

spring.jpa.generate-ddl=true

spring.mvc.view.suffix=.html
spring.thymeleaf.cache=false

spring.security.oauth2.client.registration.github.clientId=ca03ec3d033a0f433353
spring.security.oauth2.client.registration.github.clientSecret=8e6da127a4ddb2796792ec541e8b2811f314bdbd
spring.security.oauth2.client.registration.github.scope=read:user,user:email

server.error.path=/error

## MULTIPART (MultipartProperties)
# Enable multipart uploads
spring.servlet.multipart.enabled=true

# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size.
spring.servlet.multipart.max-file-size=200MB
# Max Request Size
spring.servlet.multipart.max-request-size=215MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
